name: Windows Portable
run-name: Windows portable · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

jobs:
  build:
    name: Test and build portable app
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: python .github/scripts/install_dependencies.py --bundle

      - name: Install build toolchain
        run: python -m pip install "cython>=3" setuptools

      - name: Compile sources to native extensions
        shell: pwsh
        run: python setup.py build_ext --inplace --force

      - name: Run tests
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          ACTIONS_RUNTIME_TOKEN: ''
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ''
        run: ./run_tests.ps1

      - name: Set package version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v\d+\.\d+\.\d+(-(alpha|beta|rc)\.\d+)?$') {
              throw "Unsupported release tag: $env:GITHUB_REF_NAME"
            }
            $env:GITHUB_REF_NAME
          } else {
            "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          $prerelease = $version -notmatch '^v\d+\.\d+\.\d+$'
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Strip Python sources from the build tree
        shell: pwsh
        run: |
          $stripped = 0
          Get-ChildItem -Recurse -Filter '*.py' src | Where-Object {
            $_.Name -ne '__init__.py' -and (Test-Path ($_.FullName -replace '\.py$', '.cp312-win_amd64.pyd'))
          } | ForEach-Object {
            Remove-Item $_.FullName
            $stripped++
          }
          if (Test-Path config.py) { Remove-Item config.py; $stripped++ }
          if ($stripped -lt 100) { throw "Expected to strip 100+ sources, stripped $stripped" }
          "Stripped $stripped source files; the package ships compiled modules only."

      - name: Build portable app
        run: python -m PyInstaller --noconfirm xjtu-ww.spec
      - name: Verify portable startup
        run: ./.github/scripts/test_portable.ps1

      - name: Package portable app
        shell: pwsh
        run: |
          $metadata = [ordered]@{
            version = $env:APP_VERSION
            commit = $env:GITHUB_SHA
            run_url = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            python = (python --version)
            requirements_sha256 = (Get-FileHash requirements.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $metadata | ConvertTo-Json | Set-Content 'dist/xjtu-ww/build-info.json' -Encoding utf8
          $archive = "dist/xjtu-ww-$env:APP_VERSION-windows-x64.zip"
          python -m zipfile -c $archive dist/xjtu-ww
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($archive))" | Set-Content "$archive.sha256" -Encoding ascii
          @(
            "Version: $env:APP_VERSION",
            "Commit: $env:GITHUB_SHA",
            "Package: $([System.IO.Path]::GetFileName($archive))",
            "SHA-256: $hash"
          ) -join "`n`n" | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload portable app
        uses: actions/upload-artifact@v7
        with:
          name: windows-portable
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: portable-diagnostics
          path: |
            build/portable-smoke.*.log
            build/xjtu-ww/warn-xjtu-ww.txt
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish portable app
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download portable app
        uses: actions/download-artifact@v8
        with:
          name: windows-portable
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            解压 Windows 便携包后运行 `xjtu-ww.exe`，直接进入本体主界面。游戏操作需要管理员权限时，请以管理员身份运行。
            包内已包含 Python、依赖、OCR 模型及工坊入口。更新时解压到新目录，再复制旧目录的 `configs`、`xjtu_scripts` 和 `xjtu_import`（如有）。
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.sha256
