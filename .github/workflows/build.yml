name: Windows Portable
run-name: Windows portable · ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: '3.12'
  PYTHONIOENCODING: 'UTF-8'
  PYTHONLEGACYWINDOWSSTDIO: 'UTF-8'

jobs:
  build:
    name: Test and build portable app
    runs-on: windows-latest
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python .github/scripts/install_dependencies.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install ".[bundle]"

      - name: Run tests
        timeout-minutes: 20
        run: ./run_tests.ps1

      - name: Set package version
        id: version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $env:GITHUB_REF_NAME
          } else {
            "dev-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          $prerelease = $version -notmatch '^v\d+\.\d+\.\d+$'
          "prerelease=$($prerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Build portable app
        run: python -m PyInstaller --noconfirm xjtu-ww.spec

      - name: Verify portable startup
        run: ./.github/scripts/test_portable.ps1

      - name: Package portable app
        shell: pwsh
        run: |
          $archive = "dist/xjtu-ww-$env:APP_VERSION-windows-x64.zip"
          python -m zipfile -c $archive dist/xjtu-ww
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $([System.IO.Path]::GetFileName($archive))" | Set-Content "$archive.sha256" -Encoding ascii

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish portable app
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download portable app
        uses: actions/download-artifact@v4
        with:
          name: windows-portable
          path: dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            解压 Windows 便携包后运行 `xjtu-ww.exe`，直接进入本体主界面。游戏操作需要管理员权限时，请以管理员身份运行。
            包内已包含 Python、依赖、OCR 模型及工坊入口。更新时解压到新目录，再复制旧目录的 `configs`、`ok_tasks` 和 `ok_import`（如有）。
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.zip
            dist/*.sha256
